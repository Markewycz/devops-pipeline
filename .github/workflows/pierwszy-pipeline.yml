name: Pierwszy pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  PROJEKT: "devops-pipeline"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v3

      - name: Wypisz wiadomość
        run: echo "Pipeline działa!"

      - name: Sprawdz pliki
        run: ls -la

      - name: Sprawdz branch
        run: echo "Branch $GITHUB_REF_NAME"

  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v3

      - name: Sprawdz czy README istnieje
        run: |
          if [ -f README.md ]; then
            echo "README istnieje - OK"
          else
            echo "Brak README!"
            exit 1
          fi
